[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-provider-router"
version = "0.1.1"
description = "Switch Codex between multiple Responses API providers in the same conversation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "shirou10086" }]
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
codex-provider-router = "codex_provider_router.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.urls]
Homepage = "https://github.com/shirou10086/codex-provider-router"
Repository = "https://github.com/shirou10086/codex-provider-router"
Issues = "https://github.com/shirou10086/codex-provider-router/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
